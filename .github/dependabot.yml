version: 2
updates:
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
    # Conventional Commits titles, so the PR title check passes; one grouped PR per week
    commit-message:
      prefix: "chore(deps)"
    groups:
      python:
        patterns: ["*"]
    ignore:
      # the OAuth shim runs on Starlette and the auth flow is not covered end to end:
      # its majors are upgraded deliberately
      # (a version range, because update-types is not applied to ">=" requirement bumps)
      - dependency-name: "starlette"
        versions: [">=1.0"]
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: "chore(deps)"
    ignore:
      # the Python version of the image is upgraded deliberately (runtime + dependencies tested)
      - dependency-name: "python"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: "chore(ci)"
    groups:
      actions:
        patterns: ["*"]
